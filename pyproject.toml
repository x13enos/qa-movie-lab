[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-qa-lab"
version = "0.1.0"
description = "A local movie catalog for black-box QA practice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
